name: Build MyFamilyHQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk MyFamilyHQ.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyFamilyHQ-apk
          path: MyFamilyHQ.apk
      - name: Publish release (download link for the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" MyFamilyHQ.apk \
            --title "MyFamilyHQ v${{ github.run_number }}" \
            --notes "Install MyFamilyHQ.apk on Android 8+. Opens the live MY (MartinYoun) Family HQ planner in Chrome." \
            --latest
